- name: Deploy Subscription Tracker with Docker Compose
  hosts: subscription_servers
  become: true

  vars_files:
    - group_vars/all.example.yml

  tasks:
    - name: Install Docker dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy project files
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - Dockerfile
        - docker-compose.yml
        - go.mod
        - go.sum

    - name: Copy project directories
      ansible.builtin.copy:
        src: "../{{ item }}/"
        dest: "{{ app_dir }}/{{ item }}/"
        mode: preserve
      loop:
        - cmd
        - docs
        - internal
        - migrations

    - name: Render environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Start application
      ansible.builtin.command:
        cmd: docker compose --env-file .env up -d --build
        chdir: "{{ app_dir }}"
      changed_when: true
